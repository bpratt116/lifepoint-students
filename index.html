<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LifePoint Students | Info Sign-Up</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#f4f1f1;color:#222}
header{background:#6B1E2E;color:#fff;text-align:center;padding:28px 16px 40px}
header h1{margin:0;font-size:28px;letter-spacing:2px}header p{margin:6px 0 0;opacity:.9}
main{max-width:460px;margin:-18px auto 40px;background:#fff;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.08);padding:28px 24px}
h2{margin:0 0 8px;color:#6B1E2E;font-size:22px}p.lead{margin:0 0 20px;color:#555;line-height:1.45}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
input{width:100%;padding:12px 14px;font-size:16px;border:1px solid #ccc;border-radius:8px}
input:focus{outline:2px solid #6B1E2E;border-color:#6B1E2E}
button{margin-top:22px;width:100%;padding:14px;font-size:17px;font-weight:700;color:#fff;background:#6B1E2E;border:0;border-radius:8px;cursor:pointer}
.err{color:#b00020;font-size:14px;min-height:18px;margin-top:10px}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tags span{background:#f3e7ea;color:#6B1E2E;padding:4px 10px;border-radius:99px;font-size:13px;font-weight:600}
#ov{display:none;position:fixed;inset:0;background:#000;z-index:9}#ov.on{display:flex;align-items:center;justify-content:center}#pl{width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh}
footer{text-align:center;color:#888;font-size:13px;padding-bottom:30px}
</style></head><body>
<header><h1>LIFEPOINT STUDENTS</h1><p>Student Ministry Information</p></header>
<main>
<h2>Stay in the loop</h2>
<div class="tags"><span>Events</span><span>Small Groups</span><span>Parent Info</span></div>
<p class="lead">Sign up to get event updates, small group info, and parent announcements. We meet Sundays 5:30–7:30 PM at LifePoint Church, Quincy IL.</p>
<form id="f" novalidate>
<label for="n">Name</label><input id="n" autocomplete="name" placeholder="First and last name">
<label for="e">Email</label><input id="e" type="email" autocomplete="email" placeholder="you@example.com">
<button type="submit">Submit</button><div class="err" id="err"></div>
</form>
</main>
<div id="ov"><div id="pl"></div></div>
<footer>© LifePoint Church · Quincy, Illinois</footer>
<script>
document.getElementById('f').addEventListener('submit',function(ev){ev.preventDefault();
var n=document.getElementById('n').value.trim(),e=document.getElementById('e').value.trim();
if(!n||e.indexOf('@')<1){document.getElementById('err').textContent='Please enter your name and a valid email.';return;}
var f=document.createElement('iframe');
f.src='https://www.youtube-nocookie.com/embed/lXMskKTw3Bc?autoplay=1&playsinline=1&rel=0&modestbranding=1';
f.allow='autoplay; encrypted-media; fullscreen; picture-in-picture';f.allowFullscreen=true;
f.style.cssText='width:100%;height:100%;border:0';
document.getElementById('pl').appendChild(f);document.getElementById('ov').className='on';
});
</script></body></html>
